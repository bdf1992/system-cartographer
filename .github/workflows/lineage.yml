name: Public lineage
on:
  push:
    paths: ['lineage/**', 'README.md', '.clarity/**', '.github/workflows/lineage.yml']
  pull_request:
    paths: ['lineage/**', 'README.md', '.clarity/**', '.github/workflows/lineage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r lineage/requirements.txt
      - run: python lineage/validate.py
      - run: python -m unittest discover -s lineage/tests -v
      - run: python lineage/verify_sources.py --remote --live-inventory
      - run: python lineage/render.py --check
      - run: python lineage/verify_clarity.py
      - name: Check the generated document with Schematically's data core
        run: |
          git clone --no-checkout https://github.com/bdf1992/schematically.git "$RUNNER_TEMP/schematically"
          git -C "$RUNNER_TEMP/schematically" checkout 5622888813a07fcc83868028b47fc9017302da77
          node "$RUNNER_TEMP/schematically/scripts/validate_sov.mjs" lineage/lineage.sov
