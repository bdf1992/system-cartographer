<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graph view</title>
<style>
  :root { --bg: #15171a; --glass: rgba(28, 31, 34, .82); --line: #2b3035; --ink: #e9ebe6; --muted: #8b939b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #labels { pointer-events: none; }
  .glass { position: absolute; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); }
  #find { left: 16px; top: 16px; width: 320px; padding: 8px; }
  #search { width: 100%; box-sizing: border-box; background: transparent; color: inherit; border: 0; outline: 0; padding: 4px 6px; font: inherit; }
  #results { max-height: 320px; overflow: auto; }
  #results div, .nb { padding: 4px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover, .nb:hover { background: #2a2f34; }
  #results small, .nb small { color: var(--muted); margin-left: 6px; }
  #kinds { left: 16px; bottom: 16px; padding: 6px 8px; display: flex; gap: 4px; }
  #kinds button { all: unset; cursor: pointer; padding: 3px 8px; border-radius: 6px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  #kinds button.off { color: var(--muted); }
  #kinds button.off i { opacity: .25; }
  #kinds i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
  #card { right: 16px; top: 16px; width: 300px; max-height: calc(100% - 32px); overflow: auto; padding: 12px 14px; box-sizing: border-box; display: none; }
  #card b { font-size: 14px; word-break: break-word; }
  #card .m { color: var(--muted); margin-top: 2px; word-break: break-word; }
  #card h4 { margin: 12px 0 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  #stat { position: absolute; right: 16px; bottom: 12px; color: #5d656d; font: 11px ui-monospace, Consolas, monospace; pointer-events: none; }
  #tip { position: absolute; pointer-events: none; padding: 4px 8px; display: none; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="labels"></canvas>
<div id="find" class="glass"><input id="search" placeholder="Search" autocomplete="off"><div id="results"></div></div>
<div id="kinds" class="glass"></div>
<div id="card" class="glass"></div>
<div id="tip" class="glass"></div>
<div id="stat"></div>
<script src="data.js"></script>
<script>
"use strict";
const G = window.GRAPH, N = G.nodes, C = G.clusters, E = G.edges, P = G.planes;
const glc = document.getElementById("gl"), lc = document.getElementById("labels");
const gl = glc.getContext("webgl", { antialias: true, preserveDrawingBuffer: true }), ctx = lc.getContext("2d");
// One hue per plane, so colour means the domain a thing lives in. Hues are spaced by the golden angle.

// ---- geometry uploaded once ---------------------------------------------------------------------
const nodeCluster = new Int32Array(N.length);
C.forEach((c, i) => { for (let k = c.start; k < c.start + c.count; k++) nodeCluster[k] = i; });

const F = G.files || [], nodeFile = new Int32Array(N.length).fill(-1);
F.forEach((f, i) => { for (let k = f[4]; k < f[4] + f[5]; k++) nodeFile[k] = i; });
const filesOf = c => c.files ? c.files[1] : 0;         // a view written before the file level has none
const maxDeg = N.reduce((m, n) => Math.max(m, n[2]), 1);
const nodeBuf = new Float32Array(N.length * 6);
N.forEach((n, i) => { const col = PLANE_COLOR[C[nodeCluster[i]].plane], o = i * 6; nodeBuf[o] = n[0]; nodeBuf[o + 1] = n[1]; nodeBuf[o + 2] = 4 + 16 * Math.sqrt(n[2] / maxDeg); nodeBuf[o + 3] = col[0]; nodeBuf[o + 4] = col[1]; nodeBuf[o + 5] = col[2]; });

let selNode = null, selCluster = null, hoverCluster = null, hoverNode = null, context = new Set(), related = new Set(), siblings = new Set();
const toScreen = (x, y) => [(x - view.x) * view.k + W / 2, (y - view.y) * view.k + H / 2];

// Three levels, each opened by room on screen alone. A cluster on screen is open when

  const most = ties.length ? ties[0][1] : 1, fromCluster = selNode !== null && hoverCluster === null ? nodeCluster[selNode] : lit;

  for (const [o, n] of ties) {

const nbCache = new Map();

const clusterText = c => `${c.name.split(": ").pop()} ${c.count}` + (c.claims.length ? `  ${c.claims.length} claims` : "");

// The other clusters drawn from the same graphify community, in rising index order; none when the

// ---- selection ---------------------------------------------------------------------------------------
const card = document.getElementById("card"), esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
// A selection opens only itself. What it links to stays closed and is kept bright, so the eye

const TIES = 12;
function nodeTies(i) {                                  // the clusters a node links to, strongest first
  const count = new Map(); for (const j of neighbours(i)) { const c = nodeCluster[j]; if (c !== nodeCluster[i]) count.set(c, (count.get(c) || 0) + 1); }

// Bring the selection and the few things it links to most into one view, but never so far out

function frameWith(ci, others) {

  const y0 = Math.min(...list.map(i => C[i].y - C[i].r)), y1 = Math.max(...list.map(i => C[i].y + C[i].r));
  const least = Math.min(W, H) * 0.19 / c.r, k = Math.max(Math.min((W - 360) / (x1 - x0), H / (y1 - y0)) * 0.82, least);

function selectCluster(ci) {

  const rows = siblingRows(C, P, ci);

  card.innerHTML = `<b>${esc(c.name)}</b><div class="m">${c.count} members on ${esc(P[c.plane].name)}</div>` + (c.claims.length ? `<h4>Claims</h4>${c.claims.map(x => `<div>${esc(x)}</div>`).join("")}` : "") +
    (rows.length ? `<h4>Other parts of this group</h4>` + rows.map(([o, name]) => `<div class="nb" data-c="${o}">${esc(clusterText(C[o]))}<small>${esc(name)}</small></div>`).join("") : "") +
    `<h4>Linked most to</h4>` + clusterLinks[ci].slice(0, 12).map(([o, n]) => `<div class="nb" data-c="${o}">${esc(clusterText(C[o]))}<small>${n} links</small></div>`).join("");

function selectNode(i) {

  const listOf = (title, list) => list.length ? `<h4>${title} ${list.length}</h4>` + list.sort((a, b) => N[b][2] - N[a][2]).slice(0, 60).map(j => `<div class="nb" data-n="${j}">${esc(N[j][3])}<small>${esc(N[j][5].split("/").pop())}</small></div>`).join("") : "";
  const ties = nodeTies(i).map(t => t[0]);

  card.style.display = "block";
  card.innerHTML = `<b>${esc(n[3])}</b><div class="m">${esc(n[4])}${n[5] ? " in " + esc(n[5]) : ""}</div><div class="m">${n[2]} links${n[6] ? ", " + n[6] + " lint findings" : ""}</div><div class="nb m" data-c="${selCluster}">${esc(clusterText(c))}</div>` +

function clearSelection() { selNode = selCluster = null; context = new Set(); related = new Set(); siblings = new Set(); card.style.display = "none"; dirty = true; }
card.addEventListener("click", e => { const el = e.target.closest(".nb"); if (!el) return; if (el.dataset.n) selectNode(+el.dataset.n); else selectCluster(+el.dataset.c); });

// ---- input -------------------------------------------------------------------------------------------
function resize() { DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; for (const c of [glc, lc]) { c.width = W * DPR; c.height = H * DPR; } dirty = true; }
addEventListener("resize", resize);
function nodeAt(sx, sy) {
  const [wx, wy] = toWorld(sx, sy); let best = null, bestD = 12 / view.k;
  const scan = (start, count) => { for (let k = start; k < start + count; k++) { const d = Math.hypot(N[k][0] - wx, N[k][1] - wy); if (d < bestD) { bestD = d; best = k; } } };
  // Only what is drawn can be pointed at: members of an open cluster with no file level, or of an open file.
  C.forEach((c, i) => {

    if (!filesOf(c)) return scan(c.start, c.count);
    for (let k = c.files[0]; k < c.files[0] + c.files[1]; k++) if (fileOpen(F[k])) scan(F[k][4], F[k][5]);

}
const clusterAt = (sx, sy) => { const [wx, wy] = toWorld(sx, sy), i = C.findIndex(c => Math.hypot(c.x - wx, c.y - wy) < c.r); return i < 0 ? null : i; };
let drag = null; const tip = document.getElementById("tip");
glc.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false }; goal.on = false; });
addEventListener("mouseup", e => { if (drag && !drag.moved && e.target === glc) { const n = nodeAt(e.clientX, e.clientY), c = clusterAt(e.clientX, e.clientY); if (n !== null) selectNode(n); else if (c !== null) selectCluster(c); else clearSelection(); } drag = null; });
addEventListener("mousemove", e => {

const search = document.getElementById("search"), results = document.getElementById("results");
addEventListener("keydown", e => { if (e.key === "Escape") { search.value = ""; results.innerHTML = ""; search.blur(); clearSelection(); } else if (e.key === "f" && document.activeElement !== search) fit(); else if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); } });

const kinds = document.getElementById("kinds");
G.kinds.forEach((k, i) => { const b = document.createElement("button"), col = KIND_COLOR[i].map(v => v * 255 | 0); b.innerHTML = `<i style="background:rgb(${col})"></i>${k}`; b.className = kindOn[i] ? "" : "off"; b.onclick = () => { kindOn[i] = !kindOn[i]; b.className = kindOn[i] ? "" : "off"; dirty = true; }; kinds.appendChild(b); });

function loop() {
