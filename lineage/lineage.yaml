edges:
  - from: schematically
    to: soveraeign
    type: implements-format-of
    evidence: >-
      schematically's document format is namespaced under Soveraeign:
      DATA-FORMATS.md:5 defines .sov as soveraeign.schematic/document@0.1,
      DATA-FORMATS.md:18 gives the MIME type
      application/vnd.soveraeign.schematic+json, and API.md:34 returns a
      soveraeign.schematic/package@0.1 payload. index.html titles itself
      "Soveraeign Schematic Lab 0.1 Beta.24".

  - from: schematically
    to: canvas
    type: supersedes
    evidence: >-
      Stated by the owner, 2026-09-04. No textual link exists between the two
      repositories, and their vocabularies are disjoint: Canvas uses Board,
      Frame, Card and Grounded Field; schematically uses Component, Wire,
      Part and signal. What corroborates the claim is overlapping purpose —
      both arrange things in space and wire them together — and relative
      activity: schematically has 59 commits and is current, Canvas has 20.
      schematically's CANVAS-MODEL.md is not evidence; it uses "canvas" as a
      model property and names none of Canvas's terms.

  - from: ontum
    to: onton
    type: supersedes
    evidence: >-
      ontum's glossary records the rename. glyphs/knolling.md:142 lists
      "Onton | DEAD | Former unit-name", and docs/sources/rosetta-creole.md:15
      says the source "was written with the dead unit-name Onton, renamed
      Onton -> Ontum". Recorded with a caveat: this is a rename of a
      unit-name inside ontum's own vocabulary, sitting beside etymontoken and
      epistemontoken. Neither repository states that one superseded the other.

  - from: soveraeign
    to: canvas
    type: may-provide-substrate
    evidence: >-
      Canvas/README.md:5 says integrations such as Soveraeign "may provide
      stronger grounding, execution, custody, provenance, authority, and
      evidence, but they are providers of those semantics rather than
      prerequisites for Canvas itself". The dependency is optional and Canvas
      is built to work without it: TASK-2.md:38 records "no Soveraeign
      dependency" and WITNESS.md:3 proves the contract without it.

  - from: familiar
    to: soveraeign
    type: adapts
    evidence: >-
      familiar's skilltree kernel accepts Soveraeign skills as one artifact
      type. cast/tests/test_skilltree_kernel.py:49 uses the adapter
      "soveraeign-skill/v1", and line 63 lists it alongside agent-skill/v1,
      spell/v0.2 and opaque/v1.

  - from: familiar
    to: owl
    type: uses
    evidence: >-
      Owl is an agent role inside familiar's casting protocol.
      cast/examples/find-familiar/SPELL.md:31 says "The Owl Agent may conduct
      the cast using owl.system as its Familiar", and bounds it: Owl cannot
      accept the Whole for the subject, grant authority, or waive
      Requirements. The relation is one-way; Owl does not mention familiar.

  - from: s4
    to: onton
    type: sibling-phase
    evidence: >-
      Both define the term "Software 4.0" independently, on the same
      1.0/2.0/3.0 ladder, and reach different answers. onton/README.md:15
      says 4.0 is "software that types its own delivery layer". S4's
      CLAUDE.md:59 says 4.0 is a "coupled system ... not a fourth model
      class; a coupling of the three under shared discipline". Recorded with
      a caveat: neither repository references the other anywhere, so this is
      parallel work on one question rather than a cited relation.

