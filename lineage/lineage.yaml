# The relations between bdf1992's public repositories, with the evidence for each.
#
# Rules this file is kept under:
#   - Every node carries one plain claim and a command someone else can run.
#   - Every recorded result was observed by running the command, not copied
#     from a prior report.
#   - Every edge names where the relation is visible in the repositories. An
#     edge that cannot be evidenced is not recorded.
#   - Private repositories are out of scope.
#
# Observed 2026-09-04. Forks are excluded: eight of the nine contain none of
# the owner's commits.

